name: Build

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
    tags:
      - '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-server:
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_MULTIPLEXING: false
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux
          os: ubuntu-22.04
          cmake-args: -G Ninja -DIPO=ON
          package-target: package_tar_xz
          package-file: "*-linux_x86_64.tar.xz"
        - name: macos
          os: macOS-latest
          cmake-args: -G Ninja -DIPO=ON
          package-target: package_tar_xz
          package-file: "*-macos.tar.xz"
        - name: windows
          os: windows-latest
          cmake-args: -A x64 -DEXCEPTION_HANDLING=ON
          package-target: package_zip
          package-file: "*-win64.zip"

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev ninja-build pkg-config zlib1g-dev

    - name: Prepare macOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install ninja pkg-config

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
          cache-bin: false # WORKAROUND(https://github.com/Swatinem/rust-cache/issues/341)

    - name: Build server in release mode
      run: |
        mkdir release
        cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -DCLIENT=OFF -DTOOLS=OFF -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target game-server

    - name: Package
      run: |
        cd release
        cmake --build . --config Release --target ${{ matrix.package-target }}
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ddnet-server-${{ matrix.name }}
        path: release/artifacts

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v6
      with:
        path: artifacts
        merge-multiple: true

    - name: Create or update GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.ref_name }}"
        REPO="${{ github.repository }}"

        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "Release $TAG already exists; uploading assets"
          gh release upload "$TAG" artifacts/* \
            --repo "$REPO" \
            --clobber
        else
          echo "Creating release $TAG"
          gh release create "$TAG" artifacts/* \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes
        fi
